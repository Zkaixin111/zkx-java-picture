server:
  port: 8123
  servlet:
    context-path: /api
    #cookie30过期
    session:
      cookie:
        max-age: 2592000
spring:
  #session配置
  session:
    store-type: redis
    #设置30天过期
    timeout: 2592000
  application:
    name: picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-database-password}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # Redis 配置
  redis:
    database: 0
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    timeout: 5000
  # RabbitMQ 配置（异步 AI 打标）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:your-rabbitmq-username}
    password: ${RABBITMQ_PASSWORD:your-rabbitmq-password}
    publisher-confirm-type: correlated # 消息发布确认
    publisher-returns: true #消息路由失败回调
    listener:
      simple:
        acknowledge-mode: manual # 手动确认,确保消费者如果没有消费消息能告诉队列
        prefetch: 10 # 每个消费者最多预取10条未 ack 的消息
        retry:
          enabled: true # 开启消费端自动重试。
          max-attempts: 3 # 最大重试次数
          initial-interval: 2000 # 初始重试间隔
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.zkxpicturebackend.conroller

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true
# 对象存储配置（需要从腾讯云 COS 获取）
cos:
  client:
    host: ${COS_HOST:https://your-bucket-name-1234567890.cos.ap-guangzhou.myqcloud.com}
    secretId: ${COS_SECRET_ID:your-cos-secret-id}
    secretKey: ${COS_SECRET_KEY:your-cos-secret-key-here}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:your-bucket-name-1234567890}
# 阿里云 AI 配置
aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:your-aliyun-api-key}
